<?xml version="1.0" encoding="UTF-8"?>
<!--
  RetroChat — primary app icon (CRT phosphor green on black).
  Used for apple-touch-icon, PWA manifest, favicon PNG generation.

  Designed at 16×16 logical pixels so each rect snaps to the grid;
  shape-rendering=crispEdges keeps it pixel-sharp at any output size.
  Content fits within the maskable safe zone (40% radius from center).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#0a0e0a"/>
  <g fill="#00ff66">
    <!-- Bubble: top, left, right, bottom -->
    <rect x="3" y="4" width="10" height="1"/>
    <rect x="3" y="5" width="1" height="6"/>
    <rect x="12" y="5" width="1" height="6"/>
    <rect x="3" y="11" width="10" height="1"/>
    <!-- Tail (bottom-left) -->
    <rect x="5" y="12" width="2" height="1"/>
    <rect x="5" y="13" width="1" height="1"/>
    <!-- > prompt chevron -->
    <rect x="5" y="5" width="1" height="1"/>
    <rect x="6" y="6" width="1" height="1"/>
    <rect x="7" y="7" width="1" height="1"/>
    <rect x="6" y="8" width="1" height="1"/>
    <rect x="5" y="9" width="1" height="1"/>
    <!-- Block cursor -->
    <rect x="9" y="6" width="2" height="4"/>
  </g>
</svg>
